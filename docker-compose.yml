services:
  mysql-server:
    image: mysql:8.0
    container_name: MYSQL-API
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ujian
      MYSQL_USER: api_ujikom
      MYSQL_PASSWORD: api_ujikom
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - API-UJIKOM

  app-laravel:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-api
    working_dir: /var/www
    ports:
      - "8000:8000"
    volumes:
      - ./:/var/www
    command: php artisan serve --host=0.0.0.0 --port=8000
    depends_on:
      - mysql-server
    networks:
      - API-UJIKOM

  phpMyAdmin:
    image: phpmyadmin
    container_name: API-PhpMyadmin
    environment:
      PMA_HOST: mysql-server
      PMA_PORT: 3306
    ports:
      - "8081:80"
    depends_on:
      - mysql-server
    networks:
      - API-UJIKOM

volumes:
  mysql-data:

networks:
  API-UJIKOM:
    driver: bridge
